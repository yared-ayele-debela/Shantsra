name: Test SFTP reachability

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-web.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check port and SFTP login
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          nc -zv -w 10 ${{ secrets.SSH_HOST }} ${{ secrets.SSH_PORT }} || echo "PORT NOT REACHABLE FROM GITHUB"
          echo "ls" | sftp -i ~/.ssh/id_deploy -P ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no -b - ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} || echo "SFTP FAILED"