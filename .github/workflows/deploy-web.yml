name: Deploy React Frontend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-web.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: https://api.shantasra.com

      - name: Install lftp and set up SSH key
        run: |
          sudo apt-get update && sudo apt-get install -y lftp
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

      - name: Upload build via SFTP
        run: |
          lftp -e "
            set sftp:connect-program 'ssh -a -x -i $HOME/.ssh/id_deploy -o StrictHostKeyChecking=no';
            set net:max-retries 3;
            set net:timeout 30;
            open -p ${{ secrets.SSH_PORT }} sftp://${{ secrets.SSH_USER }}:dummy@${{ secrets.SSH_HOST }};
            mirror -R --delete --only-newer --parallel=4 \
              --exclude-glob .well-known --exclude-glob cgi-bin \
              backend/public/frontend-build /home/${{ secrets.SSH_USER }}/public_html;
            bye
          "