name: Deploy Laravel API

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-api.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, bcmath, xml, ctype, fileinfo

      - name: Install dependencies
        working-directory: backend
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Install lftp and set up SSH key
        run: |
          sudo apt-get update && sudo apt-get install -y lftp
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

      - name: Upload via SFTP
        run: |
          lftp -e "
            set sftp:connect-program 'ssh -a -x -i $HOME/.ssh/id_deploy -o StrictHostKeyChecking=no';
            set net:max-retries 3;
            set net:timeout 30;
            open -p ${{ secrets.SSH_PORT }} sftp://${{ secrets.SSH_USER }}:dummy@${{ secrets.SSH_HOST }};
            mirror -R --only-newer --parallel=4 \
              --exclude-glob .git --exclude-glob .github \
              --exclude-glob node_modules --exclude-glob tests \
              --exclude-glob .env --exclude-glob storage \
              --exclude-glob bootstrap/cache \
              backend /home/${{ secrets.SSH_USER }}/api.shantasra.com;
            bye
          "