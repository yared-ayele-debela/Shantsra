# Add equivalent rules to the production web server.
# Hashed frontend assets should be immutable and compressed.
location /frontend-build/assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    gzip_static on;
    brotli_static on;
}

# Redirect the alternate host and HTTP to the canonical HTTPS host.
if ($scheme = http) { return 301 https://$host$request_uri; }
